# Render Blueprint - lets Render auto-configure the service when you
# connect this repo, instead of clicking through manual dashboard setup.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: creating-tomorrow
    runtime: python
    # Manually upgraded from free in the Render dashboard (2026-09-29) to
    # eliminate spin-down/cold-start delay for users. Kept in sync here
    # deliberately - this service is Blueprint-managed, so the next
    # Blueprint sync would otherwise silently revert it back to free.
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in the Render dashboard - never in this repo
      - key: CT_MODEL
        value: claude-sonnet-5
