# Render Blueprint - lets Render auto-configure the service when you
# connect this repo, instead of clicking through manual dashboard setup.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: creating-tomorrow
    runtime: python
    # Manually upgraded from free in the Render dashboard (2026-09-29) to
    # eliminate spin-down/cold-start delay for users. Kept in sync here
    # deliberately - this service is Blueprint-managed, so the next
    # Blueprint sync would otherwise silently revert it back to free.
    plan: starter
    # Deploy only after the GitHub "Tests" workflow passes on the commit (2026-10-09), so a broken change never goes live.
    # If the tests fail, nothing deploys; fix and push again, or use Manual Deploy in the dashboard to override.
    autoDeployTrigger: checksPass
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in the Render dashboard - never in this repo
      - key: CT_MODEL
        value: claude-sonnet-5
      # Cognito User Pool ID / App Client ID / region are not secrets (the
      # frontend embeds these same values client-side too) - safe as plain
      # values here, consistent with CT_MODEL above.
      - key: COGNITO_REGION
        value: us-east-2
      - key: COGNITO_USER_POOL_ID
        value: us-east-2_uLhNvjpep
      - key: COGNITO_APP_CLIENT_ID
        value: 5rfhr0o7799aa41a5odrt9i9hd
