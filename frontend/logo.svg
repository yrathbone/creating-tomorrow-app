<svg viewBox="0 0 350 62" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Creating Tomorrow</title>
<desc id="desc">A rising wave brightening from blue to gold, next to the wordmark Creating Tomorrow and the tagline Real Skills. Brighter Tomorrows.</desc>
<defs>
  <linearGradient id="wave" x1="4" y1="52" x2="54" y2="10" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0047ab"/>
    <stop offset="0.6" stop-color="#2f6fd6"/>
    <stop offset="1" stop-color="#f0ac3f"/>
  </linearGradient>
</defs>

<g transform="translate(2,0)">
  <circle cx="50" cy="12" r="15" fill="#fbd490" opacity="0.28"/>
  <path d="M6,50 C 16,50 24,36 30,28 C 37,18 42,14 50,12" fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="6.5" fill="#f0ac3f"/>
  <circle cx="48" cy="10" r="2.6" fill="#fff3da"/>
</g>

<g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="70" y="32" font-weight="800" font-size="25" fill="#0047ab">Creating <tspan fill="#e0a641">Tomorrow</tspan></text>
  <text x="71" y="47" font-weight="700" font-size="8" letter-spacing="1.3" fill="#7c8794">REAL SKILLS. BRIGHTER TOMORROWS.</text>
</g>
</svg>
