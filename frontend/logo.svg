<svg viewBox="0 -10 480 114" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Creating Tomorrow</title>
<desc id="desc">A road curving up to a full rising sun with radiating light, next to the wordmark Creating Tomorrow and the tagline Real Skills. Brighter Tomorrows.</desc>
<defs>
  <linearGradient id="road" x1="10" y1="100" x2="86" y2="34" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0a3f8f"/>
    <stop offset="0.55" stop-color="#1f5fc4"/>
    <stop offset="1" stop-color="#7fb3ff"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.38" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#fff6de"/>
    <stop offset="0.45" stop-color="#fbc94a"/>
    <stop offset="1" stop-color="#e8962a"/>
  </radialGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffdf94" stop-opacity="0.65"/>
    <stop offset="1" stop-color="#ffdf94" stop-opacity="0"/>
  </radialGradient>
</defs>

<g>
  <circle cx="86" cy="30" r="34" fill="url(#glow)"/>

  <g stroke="#f0ac3f" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <line x1="86" y1="-4" x2="86" y2="4"/>
    <line x1="63" y1="3" x2="67" y2="9"/>
    <line x1="109" y1="3" x2="105" y2="9"/>
    <line x1="47" y1="18" x2="54" y2="21"/>
    <line x1="125" y1="18" x2="118" y2="21"/>
    <line x1="41" y1="38" x2="49" y2="37"/>
    <line x1="131" y1="38" x2="123" y2="37"/>
  </g>

  <circle cx="86" cy="30" r="17" fill="url(#sun)"/>

  <path d="M10,100 C 24,80 36,54 86,30 C 62,48 38,72 46,100 Z" fill="url(#road)"/>
  <path d="M10,100 C 24,80 36,54 86,30" fill="none" stroke="#f0ac3f" stroke-width="2.6" stroke-linecap="round"/>

  <g fill="#fbd490" opacity="0.85">
    <ellipse cx="24" cy="93" rx="2.6" ry="1.4" transform="rotate(-32 24 93)"/>
    <ellipse cx="36" cy="76" rx="2.2" ry="1.2" transform="rotate(-40 36 76)"/>
    <ellipse cx="52" cy="58" rx="1.8" ry="1" transform="rotate(-48 52 58)"/>
  </g>
</g>

<g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="150" y="42" font-weight="800" font-size="25" fill="#0047ab">Creating <tspan fill="#e0a641">Tomorrow</tspan></text>
  <text x="151" y="57" font-weight="700" font-size="8" letter-spacing="1.3" fill="#7c8794">REAL SKILLS. BRIGHTER TOMORROWS.</text>
</g>
</svg>
